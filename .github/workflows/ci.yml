name: TOSTIYK ERP CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. 设置 Python 环境
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 2. 运行后端 Pytest（内存数据库，无需真实 DB）
    - name: Run Backend Pytest
      run: |
        python -m pytest tests/ -v

    # 3. 设置 Node.js 环境
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci || npm install

    # 4. 安装 Playwright 所需的系统依赖和浏览器
    - name: Install Playwright Browsers
      run: |
        cd frontend
        npx playwright install --with-deps chromium

    # 5. 初始化测试数据库并启动后端服务
    - name: Start FastAPI Backend
      env:
        # 如果你的代码依赖特定环境变量，可以在这里注入
        TK_AUTO_CREATE_TABLES: "1"
      run: |
        # 初始化 SQLite 表结构（确保 global-setup 有表可查）
        python -c "from app.database import init_db; init_db()"
        # 后台启动后端，监听 8000 端口
        uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        # 等待后端启动就绪
        sleep 3

    # 6. 运行前端 Playwright E2E
    - name: Run Frontend Playwright E2E
      env:
        # ⚠️ 注意：这里需要填入你真实的 admin 密码，或者在 GitHub 仓库 Secrets 中配置 PW_ADMIN_PASS
        PW_ADMIN_PASS: ${{ secrets.PW_ADMIN_PASS || 'admin' }} 
      run: |
        cd frontend
        PW_ADMIN_PASS=$PW_ADMIN_PASS npx playwright test --reporter=list
        
    # 7. （可选）如果测试失败，自动上传 trace 录像，方便在网页上查看
    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 7
